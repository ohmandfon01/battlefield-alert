name: Battlefield Auto Alert (TEST MODE)

on:
  schedule:
    - cron: '*/5 * * * *'   # ยิงทุก 5 นาที
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Alert
        run: |
          export TZ=Asia/Bangkok

          echo "Server UTC time: $(date -u)"
          echo "Server BKK time: $(date)"

          CURRENT_TIME=$(date +"%Y-%m-%d %H:%M:%S")

          HOUR=$(date +"%H")
          NEXT=$(( (10#$HOUR + 1) % 24 ))
          printf -v NEXT "%02d:00" $NEXT

          MESSAGE="<@&1471890897716121792>\n🧪 TEST MODE\n⏰ รอบถัดไป (คำนวณ): $NEXT\n💡 แจ้งเตือนเมื่อ: $CURRENT_TIME"

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\"$MESSAGE\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}
