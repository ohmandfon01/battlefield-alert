name: Battlefield Auto Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Alert
        shell: bash
        run: |
          export TZ=Asia/Bangkok

          CURRENT_TIME=$(date +"%H:%M:%S")
          HOUR=$(date +"%H")
          NEXT=$(( (10#$HOUR + 1) % 24 ))
          printf -v NEXT "%02d:00" $NEXT

          MESSAGE="🧪 TEST ALERT - $CURRENT_TIME | รอบถัดไป $NEXT"

          curl -v -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\"$MESSAGE\"}" \
               "${{ secrets.DISCORD_WEBHOOK }}"
